; ConcordRTS authored runtime configuration example. No game assets included.
; Start from the repository root. Replace paths with your own private data.
; Relative paths are NOT resolved relative to this INI file.
[Runtime]
ResourceRoot=RedAlert2
LocalDataRoot=local_data
DefaultMap=local_data/resources/mix_exports/multimd/2peaks.map
WindowWidth=1024
WindowHeight=640
FixedTickHz=30
TargetFps=60
ShowMainMenu=yes

[Skirmish]
ShowSetup=yes
