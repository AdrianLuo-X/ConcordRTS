; ConcordRTS self-hosted Internet service example.
; Every value below is a public placeholder. Replace the certificate
; thumbprint, relay address, and every credential digest before deployment.

[Service]
ServiceId=replace-with-your-service-id
ListenPort=47070
ListenScope=AnyIpv4
PublicRelayAddress=relay.example.invalid
CertificateStoreLocation=LocalMachine
CertificateStoreName=MY
CertificateSha1=REPLACE_WITH_40_HEX_SHA1_CERTIFICATE_THUMBPRINT

[Credentials]
replace-with-peer-id=REPLACE_WITH_64_HEX_SHA256_OF_CLIENT_CREDENTIAL

; Clients retain and submit their raw CredentialHex secret. The server file
; stores only its exact 32-byte SHA-256 digest and never the raw credential.
; Community profiles, Buddy lists, and ladder records are created beside this
; file as <this-file>.community.state; the service updates it atomically.
