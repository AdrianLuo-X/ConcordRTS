; Add this section to the runtime configuration selected with --config.
; Every placeholder must be replaced before the Internet menu can connect.

[Internet]
ServiceAddress=internet.example.invalid
ServicePort=47070
ServerName=internet.example.invalid
ServiceId=replace-with-your-service-id
PeerId=replace-with-this-player-id
CredentialHex=REPLACE_WITH_THE_CLIENT_CREDENTIAL_IN_HEX

; Optional extra pin. Normal Windows certificate-chain, hostname, and
; revocation validation always remains enabled even when this is omitted.
; LeafCertificateSha256=REPLACE_WITH_64_HEX_SHA256_OF_LEAF_CERTIFICATE
